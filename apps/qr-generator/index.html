<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QR Generator - Krisna Digital</title>
<link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="../../assets/css/global.css">
</head>
<body>


<main class="layout">
  <section class="panel">
    <h2>1. Isi QR</h2>
    <label for="data">Teks atau URL</label>
    <textarea id="data" rows="3" placeholder="https://contoh.com">https://contoh.com</textarea>

    <h2>2. Frame</h2>
    <div id="frameList" class="frame-list" role="listbox" aria-label="Pilih frame"></div>
    <p id="frameNote" class="note"></p>

    <div id="textBox" class="row hidden">
      <div><label for="frameText">Teks frame</label><input id="frameText" type="text" value="SCAN ME" maxlength="30"></div>
      <div><label for="frameColor">Warna frame</label><input id="frameColor" type="color" value="#111111"></div>
      <div><label for="frameTextColor">Warna teks</label><input id="frameTextColor" type="color" value="#ffffff"></div>
    </div>

    <div id="placeBox" class="hidden">
      <h3>Posisi QR di frame</h3>
      <label>Posisi horizontal <output id="oX"></output></label>
      <input id="posX" type="range" min="0" max="100" step="0.5">
      <label>Posisi vertikal <output id="oY"></output></label>
      <input id="posY" type="range" min="0" max="100" step="0.5">
      <label>Ukuran QR <output id="oS"></output></label>
      <input id="posS" type="range" min="5" max="100" step="0.5">
      <button id="copyPos" type="button" class="ghost">Salin nilai posisi (JSON)</button>
    </div>

    <h2>3. Tampilan QR</h2>
    <div class="row">
      <div><label for="fg">Warna QR</label><input id="fg" type="color" value="#000000"></div>
      <div><label for="bg">Warna latar</label><input id="bg" type="color" value="#ffffff"></div>
    </div>
    <div class="row">
      <div>
        <label for="dots">Bentuk titik</label>
        <select id="dots">
          <option value="square">Kotak</option>
          <option value="rounded">Membulat</option>
          <option value="dots">Titik</option>
          <option value="classy">Classy</option>
          <option value="classy-rounded">Classy bulat</option>
          <option value="extra-rounded">Extra bulat</option>
        </select>
      </div>
      <div>
        <label for="corner">Sudut</label>
        <select id="corner">
          <option value="square">Kotak</option>
          <option value="extra-rounded">Bulat</option>
          <option value="dot">Titik</option>
        </select>
      </div>
      <div>
        <label for="ec">Koreksi error</label>
        <select id="ec">
          <option value="L">L (rendah)</option>
          <option value="M" selected>M</option>
          <option value="Q">Q</option>
          <option value="H">H (tinggi)</option>
        </select>
      </div>
    </div>

    <label for="logo">Logo di tengah (opsional)</label>
    <input id="logo" type="file" accept="image/*">
    <button id="clearLogo" type="button" class="ghost hidden">Hapus logo</button>
  </section>

  <section class="panel preview">
    <h2>Pratinjau</h2>
    <div class="canvas-wrap"><canvas id="out"></canvas></div>
    <button id="download" type="button" class="primary">Unduh PNG</button>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/qr-code-styling@1.6.0/lib/qr-code-styling.js"></script>
<script src="js/app.js"></script>
  <script src="../../apps.js"></script>
  <script src="../../assets/js/platform.js"></script>
</body>
</html>
